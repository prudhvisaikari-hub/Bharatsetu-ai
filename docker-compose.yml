version: "3.9"

services:
  bharatsetu-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bharatsetu-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/bharatsetu.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BHARATSETU_MODEL=${BHARATSETU_MODEL:-claude-3-5-sonnet-20241022}
      - DPI_MODE=${DPI_MODE:-mock}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MAX_UPLOAD_BYTES=8388608
      - RATE_LIMIT_PER_MINUTE=120
    volumes:
      - bharatsetu-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bharatsetu-data:
    driver: local
